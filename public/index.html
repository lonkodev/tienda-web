<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda Web — CRUD Productos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <h1 class="mb-4">🛒 Gestión de Productos</h1>

  <!-- ── Formulario Agregar / Editar ───────────────────── -->
  <!-- El mismo formulario sirve para agregar Y editar     -->
  <!-- El JS decide si hace POST o PUT según haya id       -->
  <div class="card mb-4">
    <div class="card-header">
      <strong id="titulo-formulario">Agregar Producto</strong>
    </div>
    <div class="card-body">

      <!-- Campo oculto: guarda el id cuando estamos editando -->
      <input type="hidden" id="producto-id">

      <div class="row g-3">
        <div class="col-md-5">
          <input type="text" id="input-nombre" class="form-control" placeholder="Nombre del producto">
        </div>
        <div class="col-md-4">
          <input type="number" id="input-precio" class="form-control" placeholder="Precio">
        </div>
        <div class="col-md-3 d-flex gap-2">
          <button id="btn-guardar" class="btn btn-primary w-100">Guardar</button>
          <button id="btn-cancelar" class="btn btn-secondary w-100">Cancelar</button>
        </div>
      </div>

    </div>
  </div>

  <!-- ── Tabla de productos ─────────────────────────────── -->
  <table class="table table-bordered table-striped bg-white">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Precio</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <!-- El tbody empieza vacío: productos.js lo llena con la plantilla -->
    <tbody id="cuerpo-tabla"></tbody>
  </table>
</div>

<!-- ── Plantilla de fila ──────────────────────────────────── -->
<!-- <template> no se muestra en pantalla.                    -->
<!-- El JS la clona una vez por cada producto y llena los     -->
<!-- datos sin escribir HTML dentro del código JavaScript.    -->
<template id="plantilla-fila">
  <tr>
    <td class="col-id"></td>
    <td class="col-nombre"></td>
    <td class="col-precio"></td>
    <td>
      <button class="btn btn-warning btn-sm me-1 btn-editar">Editar</button>
      <button class="btn btn-danger btn-sm btn-eliminar">Eliminar</button>
    </td>
  </tr>
</template>

<!-- El JS va en su propio archivo: public/js/productos.js -->
<script src="/js/productos.js"></script>

</body>
</html>
